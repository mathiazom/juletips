# Development: `docker compose up --build`, then admin on http://localhost:3001 and the public site on http://localhost:3000.
# Production uses docker-compose.prod.example.yml instead.
services:
  app:
    build: app
    restart: unless-stopped
    volumes:
      - db:/data/db
      - site:/data/site
    ports:
      - '3001:8080'
  public:
    image: nginx:1.31-alpine-slim
    restart: unless-stopped
    volumes:
      - site:/usr/share/nginx/html:ro
    ports:
      - '3000:80'

volumes:
  db:
  site:
